name: Compilación del mod

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  compilar:
    name: Compilar y empaquetar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Compilar versión Fabric
        run: gradle :fabric:build --no-daemon

      - name: Compilar versión Forge
        run: gradle :forge:build --no-daemon

      - name: Guardar archivo de Fabric
        uses: actions/upload-artifact@v4
        with:
          name: MovementPlus-Fabric-1.20.1
          path: fabric/build/libs/*.jar

      - name: Guardar archivo de Forge
        uses: actions/upload-artifact@v4
        with:
          name: MovementPlus-Forge-1.20.1
          path: forge/build/libs/*.jar
