name: Build Movement+

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
      - name: Build Fabric
        run: gradle :fabric:build --no-daemon
      - name: Build Forge
        run: gradle :forge:build --no-daemon
      - name: Upload Fabric
        uses: actions/upload-artifact@v4
        with:
          name: MovementPlus-Fabric-1.20.1
          path: fabric/build/libs/*.jar
      - name: Upload Forge
        uses: actions/upload-artifact@v4
        with:
          name: MovementPlus-Forge-1.20.1
          path: forge/build/libs/*.jar
